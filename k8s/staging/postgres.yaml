# PostgreSQL for STAGING only: one StatefulSet, five databases (same init script
# as docker-compose). Production (EKS) will use a managed database (AWS RDS).
# Needs (created by scripts/staging-up.sh, never committed):
#   secret postgres-passwords, configmap postgres-init-script
apiVersion: v1
kind: Service
metadata:
  name: postgres          # services connect to DB_HOST=postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# StatefulSet (not Deployment): a database needs a STABLE identity and its OWN
# persistent disk that survives pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA                   # subfolder: the volume root contains lost+found
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-passwords     # POSTGRES_PASSWORD + *_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: init
          configMap:
            name: postgres-init-script
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

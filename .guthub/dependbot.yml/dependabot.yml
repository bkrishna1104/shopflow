# Dependabot: weekly dependency update PRs, opened against DEVELOP (not main),
# so they go through the same CI + staging path as your own changes.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/services/*"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories: ["/services/*"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    ignore:
      # Stay on the Node 24 LTS line; a new major is a deliberate decision.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(docker)"
# SonarCloud configuration for the whole monorepo (one SonarCloud project).
sonar.organization=bkrishna1104
sonar.projectKey=bkrishna1104
sonar.projectName=ShopFlow
sonar.sourceEncoding=UTF-8

# What is code and what is tests
sonar.sources=services
sonar.tests=services
sonar.test.inclusions=services/*/test/**
sonar.exclusions=**/node_modules/**,**/coverage/**,services/*/test/**

# Coverage reports written by `npm test` (paths made repo-relative by the Jenkinsfile)
sonar.javascript.lcov.reportPaths=\
  services/user-service/coverage/lcov.info,\
  services/product-service/coverage/lcov.info,\
  services/order-service/coverage/lcov.info,\
  services/payment-service/coverage/lcov.info,\
  services/notification-service/coverage/lcov.info,\
  services/web-ui/coverage/lcov.info

# Files that need a real database / process / browser are covered by the end-to-end
# smoke test, not unit tests. Excluded from the COVERAGE metric only (still analysed
# for bugs and vulnerabilities).
sonar.coverage.exclusions=\
  services/*/src/server.js,\
  services/*/src/repository.js,\
  services/*/src/lib/db.js,\
  services/*/src/lib/server.js,\
  services/web-ui/public/**

# src/lib is intentionally copied into every service (each service builds alone).
# Without this, SonarCloud reports ~40% duplication and the quality gate fails.
sonar.cpd.exclusions=services/*/src/lib/**
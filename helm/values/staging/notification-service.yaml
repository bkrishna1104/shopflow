# Staging values for notification-service. Image tags are set at deploy time:
#   --set image.tag=<version> --set migrations.image.tag=<version>
name: notification-service
image:
  repository: shopflow/notification-service
migrations:
  enabled: true
  image:
    repository: shopflow/notification-service-migrations
secretEnv:
  - name: DB_PASSWORD
    secretName: notification-service-db          # created by scripts/staging-up.sh from .env
    key: DB_PASSWORD
env:
  DB_HOST: postgres
  DB_NAME: notifications_db
  DB_USER: notifications_svc
  LOG_LEVEL: info

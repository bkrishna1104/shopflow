# Staging values for order-service. Image tags are set at deploy time:
#   --set image.tag=<version> --set migrations.image.tag=<version>
name: order-service
image:
  repository: shopflow/order-service
migrations:
  enabled: true
  image:
    repository: shopflow/order-service-migrations
secretEnv:
  - name: DB_PASSWORD
    secretName: order-service-db          # created by scripts/staging-up.sh from .env
    key: DB_PASSWORD
env:
  DB_HOST: postgres
  DB_NAME: orders_db
  DB_USER: orders_svc
  LOG_LEVEL: info
  # Other services by their Kubernetes Service DNS name (same names as docker-compose).
  USER_SERVICE_URL: http://user-service:8080
  PRODUCT_SERVICE_URL: http://product-service:8080
  PAYMENT_SERVICE_URL: http://payment-service:8080

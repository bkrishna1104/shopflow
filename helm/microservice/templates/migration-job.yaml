{{- if .Values.migrations.enabled }}
# Flyway migration Job, run by Helm as a pre-install / pre-upgrade HOOK:
#   helm upgrade -> this Job runs -> succeeds? -> then the new Deployment rolls out.
#                                  -> fails?   -> upgrade stops, old version keeps running.
# This ordering is what makes "Expand -> Migrate -> Contract" (Phase 10) safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "microservice.name" . }}-migrate
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    # Delete the previous Job before creating a new one; keep a FAILED one for debugging.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "microservice.name" . }}-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: flyway
          image: {{ required "migrations.image.repository is required" .Values.migrations.image.repository }}:{{ required "migrations.image.tag is required" .Values.migrations.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # $(VAR) is expanded by Kubernetes from the env below, so the password
          # never appears in the manifest or in `helm get values`.
          args:
            - -url=jdbc:postgresql://$(DB_HOST):5432/$(DB_NAME)
            - -user=$(DB_USER)
            - -password=$(DB_PASSWORD)
            - -connectRetries=10
            - migrate
          env:
            - name: DB_HOST
              value: {{ required "env.DB_HOST is required for migrations" .Values.env.DB_HOST | quote }}
            - name: DB_NAME
              value: {{ required "env.DB_NAME is required for migrations" .Values.env.DB_NAME | quote }}
            - name: DB_USER
              value: {{ required "env.DB_USER is required for migrations" .Values.env.DB_USER | quote }}
            {{- range .Values.secretEnv }}
            {{- if eq .name "DB_PASSWORD" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
{{- end }}
